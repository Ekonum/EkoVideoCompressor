name: Image web

# Construite sur chaque poussée touchant le serveur ou le client, pour
# qu'une image cassée se voie avant le déploiement — et seulement après
# les tests : rien ne se publie sans vérification.
#
# Deux registres le temps de la migration. `registre.ekonum.fr` (Zot), par
# le jeton OIDC de GitHub, sans aucun secret ; l'ancien
# `registry.robin-joseph.fr` reste alimenté tant que le stack y tire.
#
# Deux usages. `latest` n'est publié que depuis `main` : c'est celui que
# Watchtower surveille. Depuis une autre branche (à la demande), l'image va
# sous `transcript/preprod`, que la production ne peut pas tirer par erreur.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'ekonum.yaml'
      - 'cloud_transcription.py'
      - 'odoo_client.py'
      - '.github/workflows/deploy-web.yml'
      - '.github/workflows/build-web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'ekonum.yaml'
      - 'cloud_transcription.py'
      - 'odoo_client.py'
      - '.github/workflows/deploy-web.yml'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/build-web.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # le jeton OIDC de GitHub, la seule identité acceptée par Zot
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # `main` publie `latest`, que Watchtower surveille ; toute autre
      # branche publie sous `preprod`.
      - name: Choisir les tags
        id: tags
        run: |
          set -euo pipefail
          zot=registre.ekonum.fr/transcript
          ancien=registry.robin-joseph.fr/transcript
          # Valeurs multi-lignes : la syntaxe à délimiteur est la seule qui
          # passe dans $GITHUB_OUTPUT.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            printf 'ancien<<TAGS\n%s\n%s\nTAGS\n' "$ancien:latest" "$ancien:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            printf 'zot<<TAGS\n%s\n%s\nTAGS\n' "$zot:latest" "$zot:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            printf 'ancien<<TAGS\n%s\nTAGS\n' "$ancien:preprod" >> "$GITHUB_OUTPUT"
            printf 'zot<<TAGS\n%s\nTAGS\n' "$zot/preprod:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Champs du manifeste Ekonum produits par la chaîne, jamais à la main.
      # Hors `main`, la version est une pré-version honnête : l'image vient
      # d'une branche, pas d'une release.
      - name: Champs de build du manifeste
        id: build
        run: |
          court=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "version=0.0.0+${court}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-edge+${court}" >> "$GITHUB_OUTPUT"
          fi
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # L'ancien registre accepte les pushs anonymes ; Zot, le seul jeton
      # OIDC. Aucun identifiant ne dort dans GitHub.
      #
      # Deux publications plutôt qu'une : si Zot refuse, l'ancien registre
      # — celui où le stack tire encore — a déjà sa version, et la
      # production ne reste pas en arrière. La seconde reprend le cache.
      #
      # Le VPS est en amd64 : une image arm64 serait rejetée par
      # Portainer, et l'erreur n'apparaîtrait qu'au déploiement.
      - name: Construire et publier (ancien registre)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.build.outputs.built_at }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.ancien }}
          # `registry:2` digère mal les manifestes d'attestation, et Zot
          # n'en a pas besoin.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Juste avant de publier : le jeton OIDC est de courte durée. Pas de
      # connexion sur une PR, qui construit sans publier.
      - name: Connexion à Zot par OIDC
        if: github.event_name != 'pull_request'
        run: |
          JETON=$(curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=registre.ekonum.fr" | jq -r .value)
          echo "::add-mask::$JETON"
          printf '%s' "$JETON" | docker login -u oauth --password-stdin registre.ekonum.fr

      - name: Publier dans Zot
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.build.outputs.built_at }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.zot }}
          provenance: false
          sbom: false
          cache-from: type=gha
