<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EkoVideo</title>
<style>
  :root { --ink:#021A1A; --page:#EAEAEA; --accent:#2AD39F; --warn:#b45309; --ko:#b3261e; --ok:#0f7a5a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px; background:var(--page); color:var(--ink);
         font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:#4a5b5b; margin:0 0 24px; }
  .card { background:#fff; border:1px solid #d3dcdc; border-radius:10px; padding:18px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  button { background:var(--ink); color:#fff; border:0; border-radius:7px;
           padding:10px 16px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  label.field { display:block; margin-bottom:12px; }
  label.field span { display:block; font-size:13px; color:#40514f; margin-bottom:4px; }
  input[type=text] { width:100%; padding:7px 9px; border:1px solid #b9c6c6; border-radius:5px; font-size:14px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid #e3eaea; }
  th { font-weight:600; color:#40514f; font-size:13px; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:#5d6e6e; font-size:13px; }
  .ok { color:var(--ok); } .ko { color:var(--ko); } .warn { color:var(--warn); }
  pre { background:#f4f7f7; border:1px solid #dde5e5; border-radius:7px; padding:14px;
        overflow:auto; font-size:13px; white-space:pre-wrap; max-height:460px; }
  progress { width:100%; height:9px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>EkoVideo</h1>
  <p class="sub">Le découpage et l'encodage se font <strong>sur ce poste</strong> ;
  seules des fenêtres audio de quelques Mo partent au serveur. Ton fichier ne quitte pas ta machine.</p>

  <div class="card" id="gate" hidden>
    <h2 class="ko">Navigateur non supporté</h2>
    <p class="muted" id="gateDetail"></p>
  </div>

  <div class="card">
    <h2>1. Fichier</h2>
    <input type="file" id="file" accept="video/*,audio/*">
    <p class="muted" id="fileInfo"></p>
  </div>

  <div class="card">
    <h2>2. Contexte</h2>
    <label class="field"><span>Partie prenante (préfixe du titre : « Acritec - Sujet »)</span>
      <input type="text" id="client" placeholder="Acritec"></label>
    <label class="field"><span>Participants attendus, séparés par des virgules</span>
      <input type="text" id="speakers" placeholder="Robin, Lùka"></label>
    <label class="field"><span>Vocabulaire métier, séparé par des virgules</span>
      <input type="text" id="glossary" placeholder="Odoo, Wedophone"></label>
    <button id="go" disabled>Lancer la transcription</button>
    <p class="muted" id="estimate"></p>
  </div>

  <div class="card" id="progressCard" hidden>
    <h2>3. Avancement</h2>
    <progress id="overall" value="0" max="1"></progress>
    <p class="muted" id="phase"></p>
    <table><thead><tr><th>Fenêtre</th><th>Début</th><th>État</th><th class="num">Taille</th></tr></thead>
      <tbody id="rows"></tbody></table>
  </div>

  <div class="card" id="resultCard" hidden>
    <h2 id="resultTitle">4. Transcription</h2>
    <p class="muted" id="resultMeta"></p>
    <pre id="transcript"></pre>
  </div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
